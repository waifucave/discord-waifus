name: OCR Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach packages to and publish packages for."
        required: false
        type: string
  release:
    types: [created, published]

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/ocr-darwin-arm64
            artifact: ocr-darwin-arm64
            runner: macos-14
            install: brew install tesseract
          - package: packages/ocr-darwin-x64
            artifact: ocr-darwin-x64
            runner: macos-15-intel
            install: brew install tesseract
          - package: packages/ocr-linux-x64-gnu
            artifact: ocr-linux-x64-gnu
            runner: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          - package: packages/ocr-win32-x64
            artifact: ocr-win32-x64
            runner: windows-latest
            install: choco install tesseract -y --no-progress && printf '%s\n' 'C:\Program Files\Tesseract-OCR' >> "$GITHUB_PATH"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install JS dependencies
        run: npm ci --omit=optional

      - name: Install native OCR dependency
        shell: bash
        run: ${{ matrix.install }}

      - name: Assemble OCR package
        shell: bash
        run: npm run ocr:assemble -- --package "${{ matrix.package }}"

      - name: Pack OCR package
        shell: bash
        run: |
          mkdir -p artifacts
          (cd "${{ matrix.package }}" && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Attach package to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"
          gh release upload "$tag" artifacts/*.tgz --clobber

      - name: Publish package to npm
        if: github.event_name == 'release' || inputs.release_tag != ''
        working-directory: ${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --ignore-scripts
