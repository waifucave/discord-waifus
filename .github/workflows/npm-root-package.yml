name: Root npm Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose root package tarball should be published."
        required: true
        type: string

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LOGLEVEL: error
  NPM_CONFIG_PROGRESS: "false"

jobs:
  publish:
    name: Publish root package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set +x
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi

      - name: Download root release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set +x
          version="${RELEASE_TAG#v}"
          asset="starlight-ai-discord-waifus-${version}.tgz"
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir artifacts
          test -f "artifacts/$asset"

      - name: Publish root package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set +x
          version="${RELEASE_TAG#v}"
          name="@starlight-ai/discord-waifus"
          if npm view "$name@$version" version --silent >/dev/null 2>&1; then
            echo "$name@$version already published; skipping."
          else
            npm publish "./artifacts/starlight-ai-discord-waifus-${version}.tgz" --access public
          fi
