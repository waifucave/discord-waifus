name: Root npm Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose root package tarball should be published."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish root package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download root release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="starlight-ai-discord-waifus-${version}.tgz"
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir artifacts
          test -f "artifacts/$asset"

      - name: Publish root package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          npm publish "./artifacts/starlight-ai-discord-waifus-${version}.tgz" --access public
